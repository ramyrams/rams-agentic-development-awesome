<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VS Code + GitHub Copilot + Claude Sonnet — end-to-end workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F7F5;
    --card:#FFFFFF;
    --border:#E3E1DA;
    --ink:#1C1B19;
    --ink-soft:#5B5A54;
    --ink-mute:#8B897F;
    --you-bg:#E6F1FB; --you-fg:#0C447C; --you-mid:#185FA5;
    --cop-bg:#F1EBFC; --cop-fg:#3C3489; --cop-mid:#6B46C1;
    --bot-bg:#E1F5EE; --bot-fg:#085041; --bot-mid:#0F6E56;
    --ide-bg:#EDEDEA; --ide-fg:#44433D; --ide-mid:#6B6A63;
    --warn-bg:#FDF0DF; --warn-fg:#7A4A08;
    --good-bg:#E9F5E4; --good-fg:#2C5F1E;
    --accent:#C4501F;
    --radius:16px;
    --font-display:'Space Grotesk', 'Inter', system-ui, sans-serif;
    --font-body:'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 48px;
  }
  .app{width:100%;max-width:620px;}

  header.page{margin-bottom:22px;}
  header.page h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    line-height:1.3;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header.page p{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.55;
    max-width:56ch;
  }

  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 20px;}
  .legend span{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:500;
    padding:5px 10px;border-radius:20px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--ink-soft);
  }
  .legend svg{width:13px;height:13px;flex:none;}
  .legend .l-cop{color:var(--cop-fg);}
  .legend .l-bot{color:var(--bot-fg);}

  .stage{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:26px 26px 22px;
    min-height:300px;
    overflow:hidden;
  }

  .stepnum{
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    color:var(--ink-mute);
    letter-spacing:0.02em;
  }

  .step-head{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:12px; margin-top:14px;
  }
  .step-head h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:19px;
    line-height:1.35;
    margin:2px 0 0;
    letter-spacing:-0.01em;
    max-width:34ch;
  }
  .pill{
    flex:none;
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600;
    padding:5px 10px 5px 8px; border-radius:20px;
    white-space:nowrap;
  }
  .pill svg{width:12px;height:12px;}
  .pill.ide{background:var(--ide-bg);color:var(--ide-fg);}
  .pill.cop{background:var(--cop-bg);color:var(--cop-fg);}
  .pill.bot{background:var(--bot-bg);color:var(--bot-fg);}
  .pill.you{background:var(--you-bg);color:var(--you-fg);}
  .pill.intro{background:#FBE7DD;color:var(--accent);}

  .intro-list{margin:8px 0 0;padding-left:18px;color:var(--ink-soft);font-size:13.5px;line-height:1.75;}
  .intro-list li{margin-bottom:4px;}

  .cmp{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.5px;}
  .cmp th{text-align:left;font-weight:600;color:var(--ink);padding:6px 8px 8px;border-bottom:1.5px solid var(--border);}
  .cmp td{padding:8px;color:var(--ink-soft);border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5;}
  .cmp td:first-child{font-weight:500;color:var(--ink);white-space:nowrap;padding-left:0;}
  .cmp th:first-child{padding-left:0;}
  .cmp tr:last-child td{border-bottom:none;}

  .step-body{margin-top:12px;font-size:14.5px;line-height:1.65;color:var(--ink-soft);}
  .step-body code{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:0.92em; background:var(--ide-bg); color:var(--ink);
    padding:1px 5px; border-radius:5px;
  }
  .step-body b{font-weight:600;color:var(--ink);}

  .extra{margin-top:14px;display:flex;flex-direction:column;gap:10px;}

  .bubble{
    font-size:13.5px; line-height:1.6; padding:10px 13px;
    border-radius:12px; max-width:90%;
  }
  .bubble.you{background:var(--you-bg);color:var(--you-fg);margin-left:auto;border-radius:12px 12px 3px 12px;}
  .bubble.bot{background:var(--bot-bg);color:var(--bot-fg);margin-right:auto;border-radius:12px 12px 12px 3px;}
  .bubble code{background:rgba(0,0,0,0.06);}
  .bubble.skill{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,monospace;}

  .chipset,.toks,.loopline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .chip{
    font-size:11.5px;font-family:ui-monospace,monospace;
    background:var(--ide-bg);color:var(--ink-soft);
    border-radius:7px;padding:5px 9px;
  }
  .tok{
    font-family:ui-monospace,monospace;font-size:11px;
    background:#232043;color:#CADCFC;border-radius:6px;padding:4px 7px;
  }
  .arrow{color:var(--ink-mute);font-size:14px;}

  .branch{display:flex;gap:10px;}
  .bcard{flex:1;border-radius:12px;padding:11px 12px;}
  .bcard.good{background:var(--good-bg);}
  .bcard.warn{background:var(--warn-bg);}
  .bcard .blabel{font-size:12px;font-weight:600;margin-bottom:5px;color:var(--ink);}
  .bcard .bnote{font-size:12.5px;color:var(--ink-soft);line-height:1.5;}

  .loopback{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;color:var(--accent);font-weight:500;
  }
  .loopback svg{width:13px;height:13px;}

  .controls{margin-top:18px;display:flex;align-items:center;gap:10px;}
  .dots{
    flex:1;display:flex;gap:4px;flex-wrap:wrap;
    justify-content:center;
  }
  .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--border);border:none;padding:0;cursor:pointer;
  }
  .dot.active{background:var(--accent);width:16px;border-radius:4px;}

  .ctrl-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:14px;
  }
  .ctrl-group{display:flex;align-items:center;gap:6px;}
  button.ctrl{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:10px;
    border:1px solid var(--border);background:var(--card);
    color:var(--ink-soft);cursor:pointer;
  }
  button.ctrl:hover{border-color:var(--ink-mute);color:var(--ink);}
  button.ctrl svg{width:15px;height:15px;}
  button.ctrl:disabled{opacity:0.35;cursor:default;}
  .counter{font-size:12px;color:var(--ink-mute);font-variant-numeric:tabular-nums;}
</style>
</head>

<div class="app">
  <header class="page">
    <h1>How VS Code, GitHub Copilot, and Claude Sonnet work together</h1>
    <p>An end-to-end walk-through of one coding request, from opening the editor to committing the result — navigate with the buttons below.</p>
  </header>

  <div class="legend">
    <span><svg><use href="#i-ide"/></svg> VS Code — editor &amp; UI</span>
    <span class="l-cop"><svg><use href="#i-cop"/></svg> GitHub Copilot — orchestrates</span>
    <span class="l-bot"><svg><use href="#i-bot"/></svg> Claude Sonnet — the model</span>
  </div>

  <div class="stage">
    <div class="stepnum" id="stepNum">STEP 1 / 31</div>
    <div class="step-head">
      <h2 id="stepTitle"></h2>
      <span class="pill" id="stepPill"></span>

</div>

<script>
const ACTORS = {
  ide: {label:'VS Code', icon:'i-ide', cls:'ide'},
  cop: {label:'Copilot', icon:'i-cop', cls:'cop'},
  bot: {label:'Sonnet', icon:'i-bot', cls:'bot'},
  you: {label:'You', icon:'i-you', cls:'you'},
  copbot: {label:'Copilot + Sonnet', icon:'i-cop', cls:'cop'},
  intro: {label:'Overview', icon:'i-sparkle', cls:'intro'}
};

const steps = [
{ actor:'intro', title:'What you\'ll learn', body:'This walkthrough follows one real request from start to finish: migrating <code>UserAuthService</code> from session tokens to JWT, without breaking the <code>IAuthService</code> interface other code depends on.',
  extra:`<ul class="intro-list">
    <li>Who actually does what &mdash; VS Code, GitHub Copilot, and Claude Sonnet each have a distinct job</li>
    <li>Where custom instructions, agents, and skills load, and how each one reaches the model</li>
    <li>How the tool-calling loop, prompt caching, and safety controls (approval, iteration limits) work</li>
    <li>What happens when something goes wrong &mdash; a failing test, a dropped API call, a hit limit</li>
    <li>What the whole thing costs, and which steps are the levers on that</li>
  </ul>
  <div class="step-body" style="margin-top:12px">The example prompt used throughout:</div>
  <div class="bubble you">Update <code>UserAuthService</code> in <code>src/services/auth.ts</code> to use JWT. Keep the existing <code>IAuthService</code> interface intact.</div>
  <div class="step-body" style="margin-top:2px">The goal behind it: swap the authentication mechanism without touching the public interface or breaking existing callers &mdash; that constraint is what drives several of Sonnet's decisions later on.</div>` },

{ actor:'ide', title:'Set up Copilot', body:'Install the <b>GitHub Copilot</b> extension, sign in with an account that has model access, and open the project folder. Which models you can pick &mdash; including Claude Sonnet &mdash; depends on your Copilot plan and any model policy your organization has set.' },

{ actor:'cop', title:'Open agent mode', body:'Copilot Chat has three modes &mdash; Ask, Edit, and Agent. Agent is the one that can call tools on its own across multiple steps; the other two are single-turn. Switch to <b>Agent</b> and pick <b>Claude Sonnet</b> as the model Copilot will call on your behalf.',
  extra:`<table class="cmp">
    <tr><th>Mode</th><th>What it does</th></tr>
    <tr><td>Ask</td><td style="white-space:normal">Answers questions, suggests code &mdash; never edits files itself</td></tr>
    <tr><td>Edit</td><td style="white-space:normal">Edits files you name, in one pass, no tool loop</td></tr>
    <tr><td>Agent</td><td style="white-space:normal">Picks its own files, runs commands, iterates until done</td></tr>
  </table>
  <div class="step-body" style="margin-top:10px">Everything from here on is specific to Agent mode &mdash; it's the only one that runs the loop this walkthrough describes.</div>` },

{ actor:'cop', title:'Default Agent mode vs. a custom agent', body:'Both run the exact same loop from here on &mdash; the difference is entirely in what gets fed into it at setup.',
  extra:`<table class="cmp">
    <tr><th></th><th>Default Agent mode</th><th>A custom agent</th></tr>
    <tr><td>Selection</td><td>Pick "Agent" from the mode dropdown</td><td>Pick a named agent from that same dropdown</td></tr>
    <tr><td>Instructions</td><td>Repo + path instructions only</td><td>Same, plus the agent's own body text prepended to your message</td></tr>
    <tr><td>Tools</td><td>Everything Copilot offers</td><td>Only what its <code>tools:</code> field lists &mdash; or everything, if omitted</td></tr>
    <tr><td>Model</td><td>Whatever you pick in the model dropdown</td><td>Can be pinned by its <code>model:</code> field, overriding your picker</td></tr>
    <tr><td>MCP servers</td><td>All connected servers available</td><td>Can be scoped to just this agent via <code>mcp-servers:</code></td></tr>
    <tr><td>Hooks</td><td>Only workspace/user-level hooks apply</td><td>Adds agent-scoped hooks on top of those</td></tr>
    <tr><td>Switching mid-task</td><td>Not built in</td><td><code>handoffs:</code> can hand off to another named agent, optionally auto-sending a prompt</td></tr>
    <tr><td>Sub-agents</td><td>Not built in</td><td><code>agents:</code> lets it delegate sub-tasks to other agents and get results back</td></tr>
  </table>` },

{ actor:'cop', title:'Copilot loads instructions, agents & skills', body:'Before you type anything, Copilot &mdash; not Sonnet &mdash; reads what the repo and your user profile have configured:',
  extra:`<div class="chipset">
    <span class="chip">.github/copilot-instructions.md</span>
    <span class="chip">*.instructions.md</span>
    <span class="chip">.github/agents/*.agent.md</span>
    <span class="chip">.github/skills/&lt;name&gt;/SKILL.md</span>
  </div>
  <div class="step-body" style="margin-top:2px">Sonnet never touches disk or reads these files itself &mdash; Copilot reads them and decides what to forward. When more than one instructions file applies, the more specific, path-scoped one layers on top of the repo-wide one, rather than replacing it.</div>` },

{ actor:'cop', title:'Org content exclusions have a gap', body:'Enterprises can block Copilot from reading certain files org-wide &mdash; secrets, compliance-sensitive paths, entire directories. Worth knowing: as currently documented, that protection does not extend to Edit or Agent mode in VS Code &mdash; the exact mode this whole walkthrough uses. Confirm current coverage against GitHub\'s docs before relying on it for anything sensitive.',
  extra:`<div class="branch"><div class="bcard warn" style="flex:1"><div class="blabel">Documented limitation</div><div class="bnote">Content exclusion applies to completions, Chat's Ask mode, and code review &mdash; not to Edit or Agent mode.</div></div></div>` },

{ actor:'you', title:'Add context (optional)', body:'Attach files or point at symbols before prompting, so Copilot doesn\'t have to spend its first tool calls just locating things. It\'s optional &mdash; Sonnet can always ask to read a file itself &mdash; but doing it up front saves iterations.',
  extra:`<div class="bubble you">#file:auth.ts #file:auth.test.ts @workspace what calls <code>generateToken</code>?</div>` },

{ actor:'you', title:'Send your request', body:'State the file, class, and constraint up front so the first tool calls land well. A vaguer version of this same ask &mdash; "add JWT support" &mdash; would likely cost a few extra iterations of exploration before Sonnet even starts editing.',
  extra:`<div class="bubble you">Update <code>UserAuthService</code> in <code>src/services/auth.ts</code> to use JWT. Keep the existing <code>IAuthService</code> interface intact.</div>` },

{ actor:'cop', title:'Copilot assembles the prompt', body:'Copilot\'s agent runtime stitches together, in order: system instructions, your custom instructions, resolved context, chat history, then your message &mdash; done before Sonnet is ever called. The order isn\'t arbitrary: it\'s also what makes caching possible two steps from now, stable content first, your new message last.',
  extra:`<div class="bubble bot">.github/copilot-instructions.md: "Always use TypeScript strict mode. Prefer named exports. Write tests for new public functions."</div>` },

{ actor:'cop', title:'Copilot routes the call through GitHub', body:'Copilot doesn\'t call Anthropic directly, and it doesn\'t use your own Anthropic key. It sends the assembled prompt to GitHub\'s own Copilot service, authenticated by your Copilot subscription. GitHub\'s backend then routes it server-side to Anthropic\'s infrastructure to actually run Sonnet. In practice, that means no separate Anthropic account is needed, and your data-handling terms come from your GitHub Copilot agreement.',
  extra:`<div class="loopline">
    <span class="chip">VS Code</span><span class="arrow">→</span>
    <span class="chip">GitHub Copilot service</span><span class="arrow">→</span>
    <span class="chip">Anthropic (Sonnet)</span>
  </div>
  <div class="step-body" style="margin-top:2px">Tokenizing happens at that last hop, inside Anthropic's infrastructure &mdash; not in VS Code, and not on GitHub's servers either.</div>
  <div class="toks"><span class="tok">Always</span><span class="tok">use</span><span class="tok">TypeScript</span><span class="tok">strict</span><span class="tok">mode</span><span class="tok">&hellip;</span></div>` },

{ actor:'cop', title:'Copilot marks cacheable parts', body:'Copilot flags the stable portions &mdash; system + custom instructions, tool defs &mdash; so Anthropic\'s API can reuse them instead of reprocessing, cheaper from the second call onward. On a task that takes ten loop iterations, this is often the difference between paying for ten full copies of the instructions and paying for one.',
  extra:`<table class="cmp">
    <tr><th>Cached (reused)</th><th>Sent fresh each call</th></tr>
    <tr><td style="white-space:normal">System instructions, custom instructions, tool + skill definitions</td><td>Your new message, the latest tool results</td></tr>
  </table>
  <div class="step-body" style="margin-top:10px">The cache only works from the top down &mdash; change one character in your custom instructions and everything after it has to be reprocessed. That's the real argument for keeping standing instructions stable, not just short.</div>` },

{ actor:'cop', title:'Copilot attaches its tool list', body:'The tools &mdash; <code>read_file</code>, <code>edit</code>, <code>run_tests</code> &mdash; are implemented by Copilot, not Sonnet. Copilot sends their names, descriptions, and schemas along with the prompt. A custom agent can narrow which tools are offered &mdash; and MCP servers, next, can extend that same list further.',
  extra:`<div class="bubble bot" style="max-width:100%;font-family:ui-monospace,monospace;font-size:11.5px;line-height:1.65">{ name: "read_file",<br>&nbsp;&nbsp;description: "Read the contents of a file at a given path.",<br>&nbsp;&nbsp;parameters: { path: "string", startLine: "number?" } }</div>
  <div class="step-body" style="margin-top:10px">That description is written <i>for the model</i> &mdash; it's how Sonnet decides which tool fits. A vague description is the usual reason an agent picks the wrong tool, which is worth remembering when you write your own MCP server or custom agent.</div>` },

{ actor:'cop', title:'MCP servers extend the tool list', body:'MCP (Model Context Protocol) is an open standard for plugging external tools into an agent &mdash; a database, a ticketing system, a browser. A server can run locally (a command Copilot starts) or remotely (a URL Copilot connects to over HTTP), configured in <code>.vscode/mcp.json</code> for the workspace, or a user-level <code>mcp.json</code> for tools you want everywhere.',
  extra:`<div class="loopline">
    <span class="chip">.vscode/mcp.json</span><span class="arrow">→</span>
    <span class="chip">MCP server process</span><span class="arrow">→</span>
    <span class="chip">Copilot's tool list</span>
  </div>
  <div class="step-body" style="margin-top:10px">Once connected, its tools sit in the tool picker right alongside Copilot's built-in ones, and Sonnet calls them exactly the same way. A custom agent can also scope specific servers to just itself via its own <code>mcp-servers</code> field.</div>
  <div class="branch"><div class="bcard warn" style="flex:1"><div class="blabel">Governance note</div><div class="bnote">For Business/Enterprise accounts, the "MCP servers in Copilot" org policy is off by default &mdash; someone has to deliberately turn it on.</div></div></div>` },

{ actor:'copbot', title:'Skill descriptions are matched', body:'Copilot includes each skill\'s name + description in the request; Sonnet is the one that judges relevance and decides to use it. This is why dozens of installed skills cost nothing on an unrelated request &mdash; only a matched skill\'s full body ever enters context.',
  extra:`<div class="bubble bot skill"><svg style="width:13px;height:13px"><use href="#i-sparkle"/></svg> Using skill: jwt-migration-checklist</div>
  <div class="step-body" style="margin-top:2px">On a match, Copilot loads that skill's full file into context for this turn only.</div>` },

{ actor:'bot', title:'Sonnet responds', body:'Sonnet is the only actor generating text here &mdash; Copilot just renders its response in the chat panel. Asking a clarifying question costs one extra turn, but it\'s cheaper than editing the wrong thing and having to undo it.',
  extra:`<div class="bubble bot">I'll read <code>auth.ts</code> first. I see two callers of the old token method &mdash; update both, or leave one on the legacy path?</div>
  <div class="step-body" style="margin-top:10px">When it does act, it doesn't run anything &mdash; it emits a structured <i>request</i> that Copilot then executes:</div>
  <div class="bubble bot" style="max-width:100%;font-family:ui-monospace,monospace;font-size:11.5px;line-height:1.65">tool_call: read_file { path: "src/services/auth.ts" }</div>
  <div class="step-body" style="margin-top:10px">That distinction is the whole architecture in one line: the model asks, the harness does. Everything Sonnet "does" to your machine passes through Copilot's code first &mdash; which is exactly where approvals and limits get enforced.</div>` },

{ actor:'you', title:'You confirm or redirect', body:'Copilot appends your reply to history and calls Sonnet again. You don\'t need to restate the file path or the JWT requirement &mdash; that\'s already sitting in the loop\'s history.',
  extra:`<div class="branch">
    <div class="bcard good"><div class="blabel">Confirm</div><div class="bnote">"Update both. Keep the interface unchanged."</div></div>
    <div class="bcard warn"><div class="blabel">Redirect</div><div class="bnote">"Leave the legacy caller alone for now."</div></div>
  </div>` },

{ actor:'cop', title:'Copilot asks for approval', body:'Sonnet requested a tool call; Copilot enforces your permission settings before running it. A permission-level dial (Default, Auto, or Bypass Approvals) sets overall autonomy for the session, layered with separate settings for which specific tools, terminal commands, and URLs auto-approve.',
  extra:`<div class="branch">
    <div class="bcard good"><div class="blabel">Allow</div><div class="bnote">Copilot runs the tool, loop continues</div></div>
    <div class="bcard warn"><div class="blabel">Skip</div><div class="bnote">Copilot tells Sonnet it was denied</div></div>
  </div>
  <div class="step-body" style="margin-top:10px">Even in the most permissive mode, Copilot still pauses for a genuine blocking question &mdash; "auto-approve" isn't "no oversight, ever." Tool-approval eligibility and terminal sandboxing can also be locked down centrally by an org admin.</div>` },

{ actor:'cop', title:"Copilot's agent loop runs", body:'This loop is Copilot\'s code, not Sonnet\'s. Copilot executes each tool locally, then calls Sonnet again with the result. From the outside this can look like Sonnet "thinking through" the task; underneath, it\'s this loop, one ordinary function call per box.',
  extra:`<div class="loopline">
    <span class="chip">Read file</span><span class="arrow">→</span>
    <span class="chip">Edit code</span><span class="arrow">→</span>
    <span class="chip">Run tests</span><span class="arrow">→</span>
    <span class="chip">Report</span>
  </div>` },

{ actor:'cop', title:'The context window fills up', body:'Every iteration adds tool calls and their output to the history, and all of it gets resent next call &mdash; so agent sessions fill the window far faster than plain chat. The window\'s size depends on which model you picked, and VS Code shows a context indicator in the chat input so you can watch it fill.',
  extra:`<div class="branch">
    <div class="bcard good"><div class="blabel">Auto-compaction</div><div class="bnote">As the window nears full, Copilot summarizes older history and keeps recent turns verbatim &mdash; the session continues uninterrupted.</div></div>
    <div class="bcard warn"><div class="blabel">Manual /compact</div><div class="bnote">Compact early, on your terms &mdash; and steer it: <code>/compact focus on the auth decisions</code>.</div></div>
  </div>
  <div class="step-body" style="margin-top:10px">Compaction is lossy by design, so quality can drift on very long sessions. Long individual tool outputs get truncated first (head and tail kept, middle dropped). For a genuinely new task, a fresh session often beats compacting a stale one.</div>` },

{ actor:'cop', title:'A sub-agent can be delegated to', body:'If the active agent declares an <code>agents:</code> list, it can hand a sub-task to a specialist mid-loop &mdash; that sub-agent runs its own loop with its own tools and instructions, then returns just the result. Your session never switches; the coordinator stays in control. (A <code>handoffs:</code> button, by contrast, moves your whole session to the other agent.)',
  extra:`<div class="loopline">
    <span class="chip">Coordinator agent</span><span class="arrow">→</span>
    <span class="chip">Sub-agent's own loop</span><span class="arrow">→</span>
    <span class="chip">Result returned</span>
  </div>
  <div class="step-body" style="margin-top:10px">Specialist agents often set <code>user-invokable: false</code> so they only run as sub-agents and don't clutter the human-facing dropdown.</div>` },

{ actor:'cop', title:'Hooks can enforce policy deterministically', body:'Beyond approval prompts, VS Code also supports agent hooks (currently in preview) &mdash; shell commands that run automatically at fixed points in the loop, like right after every tool call, regardless of what Sonnet decides. Instructions are guidance the model can still deviate from; a hook is a guarantee &mdash; it runs every time, whether or not Sonnet remembers to ask for it.',
  extra:`<div class="bubble bot" style="font-family:ui-monospace,monospace;font-size:12px">PostToolUse hook: ./scripts/scan-for-secrets.sh &mdash; blocks the edit if a key or token is detected</div>` },

{ actor:'cop', title:'A test fails', body:'Copilot captures the failing output and hands it to Sonnet on the next call. This isn\'t treated as an error state for the task &mdash; it\'s exactly the kind of feedback the loop exists to act on.',
  extra:`<div class="bubble bot">2 tests failed on the legacy path. Adjusting the token check and re-running.</div>
  <div class="loopback"><svg><use href="#i-refresh"/></svg> returns to step 18 automatically</div>` },

{ actor:'cop', title:'The API call fails', body:'Usually a transient timeout or a momentary rate limit on the call to Anthropic, not a code problem &mdash; Copilot retries with backoff so it doesn\'t hammer the same call repeatedly. Sonnet never sees the failure; the loop\'s state is untouched.',
  extra:`<div class="loopback"><svg><use href="#i-refresh"/></svg> retries, then resumes step 18</div>` },

{ actor:'cop', title:'Iteration limit reached', body:'Copilot enforces this cap, not Sonnet &mdash; left unchecked, Sonnet would keep calling tools for as long as there was something left to try. The cap exists for the two failure modes a loop invites: a task genuinely bigger than expected, and a model stuck retrying the same fix.',
  extra:`<div class="branch">
    <div class="bcard good"><div class="blabel">Continue</div><div class="bnote">Copilot raises the limit</div></div>
    <div class="bcard warn"><div class="blabel">Stop</div><div class="bnote">Copilot ends the loop</div></div>
  </div>
  <div class="step-body" style="margin-top:10px">Hitting it repeatedly is usually a signal, not a nuisance &mdash; it often means the request was too broad to land in one pass and is better split into smaller ones.</div>` },

{ actor:'you', title:'You cancel mid-loop', body:'The stop button lives in Copilot Chat. Files already edited stay edited &mdash; Copilot doesn\'t auto-revert on cancel, and whatever made it as far as the diff view in the next step is still waiting there for you.',
  extra:`<div class="step-body" style="margin-top:2px">Cancelling is safe mid-task: the conversation so far stays in the session, so you can redirect and continue rather than starting over. If the edits so far are wrong, reject them in the diff view &mdash; or fall back to Git, which is the real undo.</div>` },

{ actor:'cop', title:'Copilot shows the diff', body:'Sonnet\'s edits are staged, not applied &mdash; Copilot renders them as a reviewable diff per file, the same diff view VS Code uses for any uncommitted change.',
  extra:`<div class="branch">
    <div class="bcard good"><div class="blabel">Accept</div><div class="bnote">Copilot writes the file</div></div>
    <div class="bcard warn"><div class="blabel">Reject</div><div class="bnote">Copilot discards that edit</div></div>
  </div>` },

{ actor:'you', title:'Request refinement', body:'Not quite right? Reply again &mdash; Copilot loops this back into step 18, not from scratch.',
  extra:`<div class="bubble you">Also add a 401 response when the token is expired.</div>
  <div class="loopback"><svg><use href="#i-refresh"/></svg> continues the loop until you accept</div>` },

{ actor:'bot', title:'Task complete', body:'Sonnet\'s response has no further tool calls &mdash; concretely, no tool_call entries at all &mdash; so Copilot ends the loop and shows the final summary.',
  extra:`<div class="bubble bot">Done. JWT is in place on both callers, 401 handling added, all tests pass.</div>` },

{ actor:'cop', title:'What that session cost', body:'Since June 2026, Copilot bills on <b>usage</b>, not per request. Cost depends on the model and the number of tokens consumed &mdash; input, cached, and output &mdash; converted into <b>GitHub AI Credits</b>, where 1 credit = $0.01. Each plan includes a monthly credit allowance; paid plans can set a budget for anything beyond it.',
  extra:`<div class="loopline">
    <span class="chip">Tokens in + out</span><span class="arrow">→</span>
    <span class="chip">Model rate</span><span class="arrow">→</span>
    <span class="chip">AI Credits</span>
  </div>
  <div class="step-body" style="margin-top:10px">This is why the earlier steps matter financially: <b>every loop iteration's tokens are billable</b>, not just your original prompt. Caching discounts the repeated stable context, lean custom instructions shrink what's resent each iteration, compaction stops a long session's history from growing without bound, and the iteration cap limits how far a runaway task can go.</div>
  <div class="branch"><div class="bcard warn" style="flex:1"><div class="blabel">Worth knowing</div><div class="bnote">Code completions and next edit suggestions don't draw from credits on paid plans &mdash; chat, agent mode, code review, and CLI do. Older "premium request" multipliers only still apply to legacy annual plans.</div></div></div>` },

{ actor:'you', title:'Commit & next steps', body:'Copilot can draft a commit message on request, but committing itself is a Git action you take &mdash; Copilot doesn\'t commit on its own. Starting a new request reuses this same chat session unless you clear it.',
  extra:`<div class="bubble you">Write a commit message for these changes.</div>` },

{ actor:'intro', title:'The mental model to keep', body:'If you remember one thing from all of this:',
  extra:`<div class="bubble bot" style="max-width:100%;font-size:14px">The model is a component. The harness is what makes it an agent.</div>
  <ul class="intro-list">
    <li><b>Sonnet</b> predicts text and asks for tools. It has no memory between calls, never touches your disk, and can't enforce a limit on itself.</li>
    <li><b>Copilot</b> is the harness: it reads your files, assembles every prompt, owns the loop, runs the tools, enforces approvals and caps, and stages the diffs.</li>
    <li><b>You</b> own the constraints &mdash; how you scope the request, what instructions and agents you configure, what you approve, and what you accept.</li>
  </ul>
  <div class="step-body" style="margin-top:12px">The practical upshot: most of what feels like "the AI decided" is actually configuration someone chose &mdash; which means it's reviewable, and it's changeable.</div>` }
];

const total = steps.length;
let idx = 0;

const stepNumEl = document.getElementById('stepNum');
const titleEl = document.getElementById('stepTitle');
const pillEl = document.getElementById('stepPill');
const bodyEl = document.getElementById('stepBody');
const extraEl = document.getElementById('stepExtra');
const dotsEl = document.getElementById('dots');
const counterEl = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

steps.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'dot';
  b.setAttribute('role', 'tab');
  b.setAttribute('aria-label', 'Go to step ' + (i + 1));
  b.addEventListener('click', () => { goTo(i); });
  dotsEl.appendChild(b);
});
const dotEls = Array.from(dotsEl.children);

function render(){
  const s = steps[idx];
  const actor = ACTORS[s.actor];
  stepNumEl.textContent = 'STEP ' + (idx + 1) + ' / ' + total;
  titleEl.textContent = s.title;
  pillEl.className = 'pill ' + actor.cls;
  pillEl.innerHTML = '<svg><use href="#' + actor.icon + '"/></svg>' + actor.label;
  bodyEl.innerHTML = s.body;
  extraEl.innerHTML = s.extra || '';
  dotEls.forEach((d, i) => d.classList.toggle('active', i === idx));
  counterEl.textContent = (idx + 1) + ' / ' + total;
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === total - 1;
}

function goTo(i){
  idx = Math.max(0, Math.min(total - 1, i));
  render();
}

prevBtn.addEventListener('click', () => { goTo(idx - 1); });
nextBtn.addEventListener('click', () => { goTo(idx + 1); });

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft'){ goTo(idx - 1); }
  if (e.key === 'ArrowRight'){ goTo(idx + 1); }
});

render();
</script>
</body>
</html>
